<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        .box1 {
            width: 300px;
            padding: 20px;
            border: 10px solid green;
        }

        .box2 {
            width: 200px;
            border: 2px solid red;
            padding: 25px;
            margin-left: 25px;
        }

        .box3 {
            width: 600px;
            padding: 20px;
            border: 2px solid blue;
            margin: 20px auto;
        }

        .container {
            width: 600px;
            display: flex;
        }

        .container button {
            flex: 1;
            box-sizing: border-box;
        }

        .btn1 {
            padding: 10px;
        }

        .btn2 {
            padding: 10px;
        }

        .btn3 {
            padding: 10px;
        }

        .box4 {
            width: 250px;
            border: 2px solid purple;
            padding-top: 40px;
            padding-right: 10px;
            padding-bottom: 20px;
            padding-left: 50px;
        }

    </style>
</head>

<body>

    <h2>CSS Box Model</h2>

    <div class="box1"> This is a box </div>

    <br>

    <div class="box2">This is another box </div>

    <div class="box3">This box is centered </div>

    <div class="container">
        <button class="btn1">Button 1</button>
        <button class="btn2">Button 2</button>
        <button class="btn3">Button 3</button>
    </div>

    <br>

    <div class="box4">This is a box with different padding </div>

</body>
</html>
